name: Build and Release

on:
  push:
    branches: [master]
    tags: ['v*-zh.*']
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  PYTHONUNBUFFERED: '1'
  PYTHONUTF8: '1'
  PYTHONPATH: src
  URH_LANGUAGE: zh_CN
  QT_QPA_PLATFORM: offscreen

jobs:
  build:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x64
          - os: ubuntu-22.04
            platform: linux-x64
          - os: macos-14
            platform: macos-arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: data/release-requirements.txt
      - name: Install Linux SDR libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libhackrf-dev librtlsdr-dev libairspy-dev libusb-1.0-0 libegl1 libxkbcommon-x11-0 libxcb-cursor0 libopengl0
      - name: Install macOS SDR libraries
        if: runner.os == 'macOS'
        run: brew install hackrf librtlsdr airspy portaudio
      - name: Download Windows SDR libraries
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          curl.exe --fail --location --retry 5 --retry-all-errors --retry-delay 5 'https://github.com/jopohl/sdrbuild/releases/download/v1.1/win-x64.zip' --output windrivers.zip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force src/urh/dev/native/lib/shared
          Expand-Archive windrivers.zip src/urh/dev/native/lib/shared
      - name: Install Python dependencies
        run: python -m pip install -r data/release-requirements.txt
      - name: Build extensions and wheel
        run: |
          python -c "import os, tempfile; open(os.path.join(tempfile.gettempdir(), 'urh_releasing'), 'w').close()"
          python setup.py build_ext --inplace
          python setup.py bdist_wheel
      - name: Check Chinese UI and translations
        run: python data/check_translations.py
      - name: Regression tests
        env:
          URH_LANGUAGE: en
        run: python -m pytest -q tests/test_encoding.py tests/test_modulator.py tests/test_iq_array.py tests/test_filter.py tests/test_file_operator.py tests/test_checksum_widget.py tests/test_modulator_gui.py tests/test_options_gui.py tests/test_signal_tab_GUI.py tests/test_analysis_tab_GUI.py tests/test_generator.py
      - name: Check wheel contains translations
        run: |
          python -c "import glob, zipfile; z=zipfile.ZipFile(glob.glob('dist/*.whl')[0]); assert 'urh/i18n/zh_CN.json' in z.namelist(); print('Translation catalog included in wheel')"
      - name: Build standalone applications
        run: python data/build_release.py
      - name: Check Windows executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Push-Location pyinstaller/urh
          ./urh_debug.exe translation-smoke
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./urh_cli.exe --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Pop-Location
      - name: Check Linux executable
        if: runner.os == 'Linux'
        run: |
          ./pyinstaller/urh/urh translation-smoke
          ./pyinstaller/urh_cli/urh_cli --help
      - name: Check macOS executable
        if: runner.os == 'macOS'
        run: |
          ./pyinstaller/urh.app/Contents/MacOS/urh translation-smoke
          ./pyinstaller/urh_cli/urh_cli --help
      - name: Build Windows installer and portable archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = python src/urh/version.py
          & 'C:/Program Files (x86)/Inno Setup 6/ISCC.exe' "/dMyAppVersion=$version" /dArch=x64 data/inno.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Compress-Archive -Path pyinstaller/urh -DestinationPath "dist/URH-zh_CN-$version-windows-x64-portable.zip"
      - name: Build Linux portable archive
        if: runner.os == 'Linux'
        run: |
          cp -a pyinstaller/urh_cli pyinstaller/urh/cli
          tar -czf "dist/URH-zh_CN-$(python src/urh/version.py)-linux-x64.tar.gz" -C pyinstaller urh
      - name: Build macOS DMG
        if: runner.os == 'macOS'
        run: |
          mkdir -p build/dmg
          cp -a pyinstaller/urh.app build/dmg/
          cp -a pyinstaller/urh_cli build/dmg/cli
          ln -s /Applications build/dmg/Applications
          hdiutil create -volname 'URH 简体中文版' -srcfolder build/dmg -ov -format UDZO "dist/URH-zh_CN-$(python src/urh/version.py)-macos-arm64.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist
      - name: Add source archive and checksums
        run: |
          git archive --format=tar.gz --prefix=urh-zh_cn/ -o "dist/URH-zh_CN-${GITHUB_REF_NAME}-source.tar.gz" HEAD
          cd dist
          sha256sum * > SHA256SUMS.txt
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* --verify-tag --title "URH 简体中文版 ${GITHUB_REF_NAME}" --notes-file data/release-notes.md
